[project]
name = "reasoning-lab"
version = "0.2.0"
description = "A unified harness for LLM reasoning strategies with process reward model verification and interactive search visualization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "reasoning-lab contributors" }]
keywords = ["llm", "reasoning", "chain-of-thought", "process-reward-model", "search", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "sympy>=1.12",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
reasoning-lab = "reasoning_lab.cli:main"

[project.urls]
Homepage = "https://github.com/lim20070714-jpg/reasoning-lab"
Issues = "https://github.com/lim20070714-jpg/reasoning-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["integration: requires a live OpenAI-compatible endpoint"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
# Typographic and full-width punctuation is load-bearing here: the parser
# normalises unicode math operators and CJK punctuation from real problem sets.
allowed-confusables = ["×", "−", "–", "＝", "％", "，", "．", "：", "；"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
